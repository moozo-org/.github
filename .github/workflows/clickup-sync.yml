name: ClickUp sync (central)

on:
  workflow_call:
    secrets:
      CLICKUP_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  create-review-task:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Créer la tâche de review dans ClickUp
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          LIST_ID: ${{ vars.CLICKUP_REVIEW_LIST_ID }}
          USERS: ${{ vars.CLICKUP_USERS }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEWER}" ]; then
            echo "Review demandée à une équipe GitHub, pas à une personne : rien à faire."
            exit 0
          fi
          ASSIGNEE=$(echo "$USERS" | jq -r --arg u "$REVIEWER" '.[$u] // empty')
          if [ -z "$ASSIGNEE" ]; then
            echo "Pas d'ID ClickUp pour $REVIEWER dans CLICKUP_USERS : tâche créée sans assigné."
          fi
          DUE=$(( ($(date +%s) + 2*24*3600) * 1000 ))   # échéance : J+2
          BODY=$(jq -n \
            --arg name "Review PR #$PR_NUMBER · $REPO · $PR_TITLE" \
            --arg desc "$(printf 'Review demandée à **%s** par %s.\n\nPR : %s' "$REVIEWER" "$PR_AUTHOR" "$PR_URL")" \
            --arg tag "$(echo "pr-$(basename "$REPO")-$PR_NUMBER-$REVIEWER" | tr "[:upper:]" "[:lower:]")" \
            --argjson due "$DUE" \
            --arg assignee "$ASSIGNEE" \
            '{name:$name, markdown_content:$desc, due_date:$due, tags:["review",$tag], priority:2}
             + (if $assignee != "" then {assignees:[($assignee|tonumber)]} else {} end)')
          curl -sS --fail -X POST "https://api.clickup.com/api/v2/list/$LIST_ID/task" \
            -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" | jq '{id, url}'

  # PR créée (ou rouverte) -> la tâche ClickUp liée passe en "in progress".
  # Si des reviewers sont déjà demandés à la création, on laisse faire le job
  # "pr-on-hold" (sinon les deux jobs se disputeraient le statut).
  pr-opened:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Passer la tâche liée en "in progress"
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REVIEWERS: ${{ join(github.event.pull_request.requested_reviewers.*.login, ',') }}
          TEAMS: ${{ join(github.event.pull_request.requested_teams.*.slug, ',') }}
        run: |
          set -euo pipefail
          if [ -n "$REVIEWERS$TEAMS" ]; then
            echo "Des reviewers sont déjà demandés : le statut sera géré par le job on-hold."
            exit 0
          fi
          TASK_IDS=$(printf '%s\n%s\n%s' "$BRANCH" "$PR_TITLE" "${PR_BODY:-}" \
            | grep -oiE 'CU-[a-z0-9]+' | cut -c4- | tr '[:upper:]' '[:lower:]' | sort -u || true)
          if [ -z "$TASK_IDS" ]; then
            echo "Aucun ID CU-xxxx trouvé dans la branche / le titre / la description : rien à faire."
          fi
          for id in $TASK_IDS; do
            curl -sS --fail -X PUT "https://api.clickup.com/api/v2/task/$id" \
              -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
              -d '{"status":"in progress"}' > /dev/null \
              && echo "Tâche $id passée en in progress" \
              || echo "Impossible de modifier $id (ID inconnu ?)"
          done

  # Review demandée à quelqu'un -> la tâche ClickUp liée passe en "on hold"
  # (elle attend la review). La tâche de review, elle, est créée par le job create-review-task.
  pr-on-hold:
    if: github.event_name == 'pull_request' && github.event.action == 'review_requested'
    runs-on: ubuntu-latest
    steps:
      - name: Passer la tâche liée en "on hold"
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          TASK_IDS=$(printf '%s\n%s\n%s' "$BRANCH" "$PR_TITLE" "${PR_BODY:-}" \
            | grep -oiE 'CU-[a-z0-9]+' | cut -c4- | tr '[:upper:]' '[:lower:]' | sort -u || true)
          if [ -z "$TASK_IDS" ]; then
            echo "Aucun ID CU-xxxx trouvé dans la branche / le titre / la description : rien à faire."
          fi
          for id in $TASK_IDS; do
            curl -sS --fail -X PUT "https://api.clickup.com/api/v2/task/$id" \
              -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
              -d '{"status":"on hold"}' > /dev/null \
              && echo "Tâche $id passée en on hold" \
              || echo "Impossible de modifier $id (ID inconnu ?)"
          done

  close-on-approval:
    # Le job tourne à chaque review soumise (pour que les logs soient visibles),
    # mais ne ferme quelque chose que si c'est une validation (Approve).
    # "Request changes" ou un simple commentaire ne ferme rien.
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Afficher l'état de la review
        env:
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          echo "Review de $REVIEWER : état = $REVIEW_STATE"
          if [ "${REVIEW_STATE,,}" != "approved" ]; then
            echo "Ce n'est pas une validation (Approve) : aucune tâche ClickUp n'est fermée."
          fi

      - name: Passer la tâche de review et la tâche liée en "complete"
        if: github.event.review.state == 'approved'
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          LIST_ID: ${{ vars.CLICKUP_REVIEW_LIST_ID }}
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          complete() {
            curl -sS --fail -X PUT "https://api.clickup.com/api/v2/task/$1" \
              -H "Authorization: $CLICKUP_TOKEN" -H "Content-Type: application/json" \
              -d '{"status":"complete"}' > /dev/null && echo "Tâche $1 passée en complete"
          }

          # 1) La tâche de review du reviewer
          TAG=$(echo "pr-$(basename "$REPO")-$PR_NUMBER-$REVIEWER" | tr "[:upper:]" "[:lower:]")
          IDS=$(curl -sS --fail "https://api.clickup.com/api/v2/list/$LIST_ID/task?tags%5B%5D=$TAG" \
            -H "Authorization: $CLICKUP_TOKEN" | jq -r '.tasks[].id')
          for id in $IDS; do complete "$id"; done

          # 2) La tâche de dev liée : ID "CU-xxxx" dans la branche, le titre ou la description de la PR
          TASK_IDS=$(printf '%s\n%s\n%s' "$BRANCH" "$PR_TITLE" "${PR_BODY:-}" \
            | grep -oiE 'CU-[a-z0-9]+' | cut -c4- | tr '[:upper:]' '[:lower:]' | sort -u || true)
          if [ -z "$TASK_IDS" ]; then
            echo "Aucun ID CU-xxxx trouvé dans la branche / le titre / la description : rien d'autre à fermer."
          fi
          for id in $TASK_IDS; do complete "$id" || echo "Impossible de fermer $id (ID inconnu ?)"; done
